name: Bug report
description: Something is not working in one of our apps
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [Kanmani, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw.
    validations: { required: true }
