<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 820" width="700" height="820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="കണ്മണി മലയാളം ടൈപ്പിംഗ് ടൂൾ by SynK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&amp;display=swap');
      .ml{font-family:'Manjari','Noto Sans Malayalam','Nirmala UI',sans-serif}
    </style>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8a8f"/><stop offset="1" stop-color="#05b5a5"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2472"/><stop offset=".45" stop-color="#0a2472"/>
      <stop offset=".75" stop-color="#0b8a8f"/><stop offset="1" stop-color="#05b5a5"/>
    </linearGradient>
  </defs>

  <g transform="translate(50,0)">
    <!-- shield -->
    <path d="M292 30 C230 80 150 100 70 105 L70 300 C70 400 170 470 292 535" fill="none" stroke="#0a2472" stroke-width="12" stroke-linejoin="round"/>
    <path d="M308 30 C370 80 450 100 530 105 L530 300 C530 400 430 470 308 535" fill="none" stroke="url(#teal)" stroke-width="12" stroke-linejoin="round"/>

    <!-- letter ക -->
    <text class="ml" x="195" y="285" font-size="190" font-weight="700" fill="#0a2472" text-anchor="middle">ക</text>

    <!-- feather -->
    <path d="M440 105 C395 130 335 195 318 300 C365 255 435 195 440 105 Z" fill="url(#teal)"/>
    <path d="M320 305 C326 270 336 240 352 215" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- keyboard -->
    <g fill="#0a2472">
      <rect x="150" y="345" width="38" height="30" rx="7"/><rect x="198" y="345" width="38" height="30" rx="7"/>
      <rect x="246" y="345" width="38" height="30" rx="7"/><rect x="294" y="345" width="38" height="30" rx="7"/>
      <rect x="342" y="345" width="38" height="30" rx="7"/><rect x="390" y="345" width="38" height="30" rx="7"/>
      <rect x="172" y="388" width="38" height="30" rx="7"/><rect x="220" y="388" width="38" height="30" rx="7"/>
      <rect x="268" y="388" width="38" height="30" rx="7"/><rect x="316" y="388" width="38" height="30" rx="7"/>
      <rect x="364" y="388" width="38" height="30" rx="7"/>
      <rect x="228" y="431" width="144" height="26" rx="8"/>
    </g>
  </g>

  <!-- name -->
  <text class="ml" x="350" y="650" font-size="128" font-weight="700" fill="url(#name)" text-anchor="middle">കണ്മണി</text>

  <!-- tagline -->
  <line x1="40" y1="722" x2="150" y2="722" stroke="#0a2472" stroke-width="2"/>
  <line x1="550" y1="722" x2="660" y2="722" stroke="#0b8a8f" stroke-width="2"/>
  <text class="ml" x="350" y="732" font-size="34" fill="#0a2472" text-anchor="middle">മലയാളം ടൈപ്പിംഗ് ടൂൾ</text>

  <!-- by SynK -->
  <text x="350" y="795" font-size="30" text-anchor="middle" font-family="system-ui,Arial,sans-serif" fill="#0a2472">by <tspan font-weight="700" font-size="38">Syn</tspan><tspan font-weight="700" font-size="38" fill="#05b5a5">K</tspan></text>
</svg>
